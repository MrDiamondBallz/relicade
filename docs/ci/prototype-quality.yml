name: Prototype quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: Server, UI and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node for syntax checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: HTTP security and routing regressions
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check prototype/app.js
      - name: Install pinned development test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline catalog-fetch network boundary regressions
        run: python prototype/tests/test_catalog_fetch.py
      - name: Original project-art provenance and layout regressions
        run: python prototype/tests/test_project_art.py
      - name: Install isolated Chromium for tests
        run: python -m playwright install --with-deps chromium
      - name: Select test browser
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROME_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - name: Prototype interaction regressions
        run: python prototype/tests/test_ui.py
      - name: Adversarial metadata, storage and brand checks
        run: python prototype/tests/test_safety.py
      - name: Malformed nested snapshot regressions
        run: python prototype/tests/test_malformed.py
      - name: Real restricted-preview and CSP checks
        run: python tools/qa_preview.py
